<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GIFT Point Manager</title>
  <style>
    :root {
      --bg-color: #0d0f17;
      --card-bg: #181c2a;
      --card-border: #283046;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent-gold: #f59e0b;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --danger: #ef4444;
      --success: #10b981;
      --online-bg: rgba(59, 130, 246, 0.2);
      --online-border: #3b82f6;
      --real-bg: rgba(16, 185, 129, 0.2);
      --real-border: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding-bottom: 80px;
    }

    header {
      background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%);
      padding: 24px 20px;
      border-bottom: 1px solid var(--card-border);
    }

    .header-container {
      max-width: 960px;
      margin: 0 auto;
    }

    .logo-area {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo-area img {
      max-width: 220px;
      height: auto;
      filter: drop-shadow(0 0 10px rgba(255,255,255,0.1));
    }

    .user-profile {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .user-info h2 { font-size: 0.95rem; color: var(--text-muted); font-weight: 400; }
    .user-info h1 { font-size: 1.4rem; font-weight: 700; color: #fff; }

    .config-btn {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .config-btn.admin { border-color: var(--accent-gold); color: var(--accent-gold); }

    .status-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .point-display {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .point-label { font-size: 0.85rem; color: var(--text-muted); }
    .point-value { font-size: 2.6rem; font-weight: 800; color: var(--accent-gold); line-height: 1; }
    .point-value span { font-size: 1.1rem; color: var(--text-main); margin-left: 4px; }
    .point-subinfo { font-size: 0.85rem; color: var(--success); }

    .action-buttons { display: flex; gap: 10px; }
    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: rgba(255, 255, 255, 0.1); color: var(--text-main); }

    main {
      max-width: 960px;
      margin: 24px auto;
      padding: 0 16px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 32px 0 16px;
      border-left: 4px solid var(--accent-gold);
      padding-left: 12px;
    }
    .section-title { font-size: 1.25rem; font-weight: 700; color: #fff; }

    .controls-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .search-box { flex: 1; min-width: 200px; }
    .search-box input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: #fff;
      font-size: 0.9rem;
    }

    .category-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
    .tab {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      white-space: nowrap;
      cursor: pointer;
    }
    .tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    .contents-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      position: relative;
      transition: transform 0.2s, border-color 0.2s;
    }
    .card:hover { transform: translateY(-3px); border-color: var(--primary); }

    .card-img { height: 140px; background-size: cover; background-position: center; position: relative; }

    /* オンライン/リアル用バッジ */
    .type-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 12px;
      backdrop-filter: blur(4px);
    }
    .type-badge.online {
      background: var(--online-bg);
      border: 1px solid var(--online-border);
      color: #93c5fd;
    }
    .type-badge.real {
      background: var(--real-bg);
      border: 1px solid var(--real-border);
      color: #6ee7b7;
    }

    .card-body { padding: 14px; display: flex; flex-direction: column; flex: 1; }
    .card-date { font-size: 0.75rem; color: var(--accent-gold); font-weight: 600; margin-bottom: 4px; }
    .card-title { font-size: 0.95rem; font-weight: 600; margin-bottom: 6px; }
    .card-desc { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 12px; flex: 1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
    .card-price { font-weight: 700; color: var(--accent-gold); font-size: 1rem; }

    .show-schedule-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .show-card {
      background: linear-gradient(145deg, #181c2a 0%, #0f121d 100%);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      position: relative;
    }

    .show-card-badge {
      position: absolute;
      top: 12px; right: 12px;
      background: rgba(245, 158, 11, 0.2);
      border: 1px solid var(--accent-gold);
      color: var(--accent-gold);
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
    }

    .show-region { font-size: 1.1rem; font-weight: 700; color: #fff; margin-bottom: 10px; }
    .show-slot-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    .show-slot { font-size: 0.85rem; color: var(--text-muted); background: rgba(255,255,255,0.03); padding: 6px 10px; border-radius: 6px; }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      justify-content: center;
      align-items: center;
      padding: 16px;
      z-index: 1000;
    }
    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      max-width: 520px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      padding: 20px;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }

    .modal-img {
      width: 100%; height: 200px; background-size: cover; background-position: center; border-radius: 8px; margin-bottom: 16px; position: relative;
    }
    .modal-date { font-size: 0.85rem; color: var(--accent-gold); font-weight: 600; margin-bottom: 6px; }
    .modal-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 10px; }
    .modal-desc { font-size: 0.9rem; color: var(--text-muted); line-height: 1.6; margin-bottom: 20px; white-space: pre-wrap; }
    .modal-price-box {
      background: rgba(255,255,255,0.05); padding: 12px 16px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;
    }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%; padding: 10px; background: #0d0f17; border: 1px solid var(--card-border); border-radius: 6px; color: #fff; font-size: 0.9rem;
    }

    .history-list { display: flex; flex-direction: column; gap: 10px; }
    .history-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid var(--card-border); }
    .history-amount.plus { color: var(--success); }
    .history-amount.minus { color: var(--danger); }
  </style>
</head>
<body>

  <header>
    <div class="header-container">
      <div class="logo-area">
        <img src="gift.jpg" alt="GIFT ロゴ">
      </div>

      <div class="user-profile">
        <div class="user-info">
          <h2>GIFT Community Member</h2>
          <h1 id="user-name">ゲスト ユーザー 様</h1>
        </div>
        <button class="config-btn admin" onclick="openAdminModal()">⚙️ 管理者画面</button>
      </div>

      <div class="status-card">
        <div class="point-display">
          <div>
            <div class="point-label">現在の所持ポイント</div>
            <div class="point-value" id="current-points">3,900<span>pt</span></div>
          </div>
          <div class="point-subinfo">次回 11/1 自動付与 (+3,900pt)</div>
        </div>
        <div class="action-buttons">
          <button class="btn btn-primary" onclick="addPoints(5000)">＋ 5,000pt 追加購入</button>
          <button class="btn btn-secondary" onclick="openHistoryModal()">利用・付与履歴</button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <!-- 1. 体験・コミュニティコンテンツ (画面上部) -->
    <div class="section-header">
      <h2 class="section-title">✨ 体験・コミュニティ企画</h2>
    </div>

    <div class="controls-bar">
      <div class="category-tabs">
        <button class="tab active" onclick="filterCategory('all', this)">すべて</button>
        <button class="tab" onclick="filterCategory('cube', this)">キューブ体験</button>
        <button class="tab" onclick="filterCategory('event', this)">交流・お出かけ</button>
        <button class="tab" onclick="filterCategory('golf', this)">ゴルフ体験</button>
      </div>
      <div class="search-box">
        <input type="text" id="search-input" placeholder="🔍 キーワード検索..." oninput="handleSearch()">
      </div>
    </div>

    <div class="contents-grid" id="contents-grid"></div>

    <!-- 2. ショースケジュール一覧 -->
    <div class="section-header">
      <h2 class="section-title">🎪 MAGIC LIVE SHOW "GIFT" 全国ツアー予定</h2>
    </div>
    <div class="show-schedule-container" id="show-schedule-grid"></div>

    <!-- 3. グッズ・チケット (画面最下部) -->
    <div class="section-header">
      <h2 class="section-title">🛍️ 39 GIFT SHOP（グッズ・チケット）</h2>
    </div>
    <div class="contents-grid" id="goods-grid"></div>
  </main>

  <!-- 詳細モーダル -->
  <div class="modal" id="detail-modal">
    <div class="modal-content">
      <div class="modal-header">
        <span style="font-size:0.85rem; color:var(--text-muted);">詳細情報</span>
        <button class="config-btn" onclick="closeDetailModal()">✕</button>
      </div>
      <div id="modal-detail-body"></div>
    </div>
  </div>

  <!-- 履歴モーダル -->
  <div class="modal" id="history-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>ポイント利用・付与履歴</h3>
        <button class="config-btn" onclick="closeHistoryModal()">✕</button>
      </div>
      <div class="history-list" id="history-list"></div>
    </div>
  </div>

  <!-- 管理者モーダル -->
  <div class="modal" id="admin-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>⚙️ 管理者パネル</h3>
        <button class="config-btn" onclick="closeAdminModal()">✕</button>
      </div>
      
      <h4 style="margin-bottom:10px; color:var(--accent-gold);">1. 新規ショースケジュールの追加</h4>
      <div class="form-group">
        <label>エリア・都市名</label>
        <input type="text" id="show-region" placeholder="例: 【 東京 】">
      </div>
      <div class="form-group">
        <label>ステータス</label>
        <select id="show-status">
          <option value="開催間近！！">開催間近！！</option>
          <option value="通常受付中">通常受付中</option>
          <option value="残席わずか">残席わずか</option>
        </select>
      </div>
      <div class="form-group">
        <label>公演日時（改行で複数）</label>
        <textarea id="show-slots" rows="3" placeholder="10月18日(日) 12:00〜&#10;10月18日(日) 17:00〜"></textarea>
      </div>
      <button class="btn btn-secondary" style="width:100%; margin-bottom:20px;" onclick="addShowSchedule()">ショースケジュールを追加</button>

      <h4 style="margin-bottom:10px; color:var(--accent-gold);">2. 新規コンテンツ / グッズの追加</h4>
      <div class="form-group">
        <label>タイトル</label>
        <input type="text" id="new-title" placeholder="例: ルービックキューブ体験">
      </div>
      <div class="form-group">
        <label>種別・カテゴリ</label>
        <select id="new-category">
          <option value="cube">キューブアート（体験）</option>
          <option value="event">交流・お出かけ（体験）</option>
          <option value="golf">ゴルフ（体験）</option>
          <option value="goods">グッズ・アイテム</option>
          <option value="ticket">チケット</option>
        </select>
      </div>
      <div class="form-group">
        <label>開催形態 (区分)</label>
        <select id="new-location-type">
          <option value="online">💻 オンライン</option>
          <option value="real">📍 リアル (対面)</option>
          <option value="none">該当なし (グッズ等)</option>
        </select>
      </div>
      <div class="form-group">
        <label>開催日 / 提供予定</label>
        <input type="date" id="new-date">
      </div>
      <div class="form-group">
        <label>必要ポイント</label>
        <input type="number" id="new-points" placeholder="3900">
      </div>
      <div class="form-group">
        <label>オプション設定 (Tシャツサイズ等)</label>
        <select id="new-has-size">
          <option value="no">サイズ選択なし</option>
          <option value="yes">サイズ選択あり (S/M/L/XL)</option>
        </select>
      </div>
      <div class="form-group">
        <label>画像URL</label>
        <input type="text" id="new-img" placeholder="https://...">
      </div>
      <div class="form-group">
        <label>詳細説明</label>
        <textarea id="new-desc" rows="3" placeholder="詳細を入力"></textarea>
      </div>
      <button class="btn btn-primary" style="width:100%;" onclick="addNewItem()">新規保存・追加</button>
    </div>
  </div>

  <script>
    let currentCategory = 'all';
    let searchQuery = '';

    let userState = {
      name: "マジック太郎",
      points: 3900,
      history: [
        { date: "2026/10/01", desc: "10月分月額自動付与", amount: +3900 }
      ]
    };

    // 体験コンテンツデータ
    let experiences = [
      { id: 101, category: "cube", locationType: "online", date: "2026-10-15", title: "ルービックキューブ 6面完成オンラインWS", desc: "Zoomを使って画面越しに手順を丁寧にレクチャー！6面揃える達成感を自宅で楽しむオンライン講座です。", points: 2000, img: "https://images.unsplash.com/photo-1591994843349-f415893b3a6b?w=500" },
      { id: 102, category: "cube", locationType: "real", date: "2026-10-22", title: "ミニキューブアート作り体験（リアル）", desc: "ミニルービックキューブを並べて自分だけのドット絵アート作品を作る対面リアルワークショップです！", points: 3900, img: "https://images.unsplash.com/photo-1539628372073-0355568e063c?w=500" },
      { id: 103, category: "event", locationType: "real", date: "2026-10-18", title: "マー君とお出かけ＆交流清掃（対面）", desc: "マー君と一緒に清掃活動等へ参加し、多種多様な人々と交流するお出かけ企画（定員15名）。", points: 3900, img: "https://images.unsplash.com/photo-1529156069898-49953e39b3ac?w=500" },
      { id: 104, category: "event", locationType: "real", date: "2026-10-25", title: "メグちゃんの手料理 交流ご飯会（対面）", desc: "メグちゃん特製の手料理を囲み、アットホームな雰囲気で語り合う限定リアルご飯会（定員8名）。", points: 3900, img: "https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=500" },
      { id: 105, category: "golf", locationType: "online", date: "2026-11-01", title: "スイング動画 オンラインアドバイス", desc: "普段のゴルフスイング動画を送信いただき、ワンポイントの改善アドバイスをお返しするオンライン体験です。", points: 1500, img: "https://images.unsplash.com/photo-1535131749006-b7f58c99034b?w=500" },
      { id: 106, category: "golf", locationType: "real", date: "2026-11-12", title: "打ちっぱなし リアルゴルフ交流会（対面）", desc: "練習場で一緒にボールを打ちながらアドバイスを受けられる対面交流イベント（打席代別途）。", points: 6000, img: "https://images.unsplash.com/photo-1592919505780-303950717480?w=500" }
    ];

    // ショースケジュール
    let showSchedules = [
      { id: 1, region: "【 東京 】", status: "開催間近！！", slots: ["10月18日(日) 12:00〜", "10月18日(日) 17:00〜", "12月5日(土) 12:00〜", "12月5日(土) 17:00〜"] },
      { id: 2, region: "【 愛媛 】", status: "開催間近！！", slots: ["11月7日(土) 12:00〜", "11月7日(土) 17:00〜", "11月8日(日) 12:00〜", "11月8日(日) 17:00〜"] },
      { id: 3, region: "【 大阪 】", status: "通常受付中", slots: ["11月14日(土) 12:00〜", "11月14日(土) 17:00〜", "11月15日(日) 12:00〜", "11月15日(日) 17:00〜"] },
      { id: 4, region: "【 沖縄 】", status: "2027年開催", slots: ["1月16日(土) 12:00〜", "1月16日(土) 17:00〜", "1月17日(日) 12:00〜", "1月17日(日) 17:00〜"] },
      { id: 5, region: "【 愛知 】", status: "2027年開催", slots: ["2月13日(土) 12:00〜", "2月13日(土) 17:00〜", "2月14日(日) 12:00〜", "2月14日(日) 17:00〜"] }
    ];

    // グッズ・チケットデータ
    let goodsItems = [
      { id: 201, category: "goods", locationType: "none", date: "常時受付", title: "TEAM GIFTER Tシャツ", desc: "コミュニティ公式Tシャツ。サイズ展開：S・M・L・XL", points: 6000, hasSize: true, img: "https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=500" },
      { id: 202, category: "ticket", locationType: "none", date: "常時受付", title: "GIFTチケット 【1枚】", desc: "MAGIC LIVE SHOW GIFTの鑑賞招待チケットです。", points: 16500, hasSize: false, img: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=500" }
    ];

    function renderUI() {
      document.getElementById('user-name').innerText = userState.name + " 様";
      document.getElementById('current-points').innerHTML = userState.points.toLocaleString() + '<span>pt</span>';
      renderExperiences();
      renderShowSchedules();
      renderGoods();
      renderHistory();
    }

    function getTypeBadgeHtml(type) {
      if (type === 'online') {
        return '<div class="type-badge online">💻 オンライン</div>';
      } else if (type === 'real') {
        return '<div class="type-badge real">📍 リアル (対面)</div>';
      }
      return '';
    }

    function renderExperiences() {
      const grid = document.getElementById('contents-grid');
      grid.innerHTML = '';

      let filtered = experiences.slice().sort((a, b) => new Date(a.date) - new Date(b.date));

      filtered = filtered.filter(item => {
        const matchCat = (currentCategory === 'all' || item.category === currentCategory);
        const matchSearch = item.title.includes(searchQuery) || item.desc.includes(searchQuery);
        return matchCat && matchSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding: 30px; color: var(--text-muted);">該当する体験企画はありません。</div>';
        return;
      }

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => openDetailModal(item, 'exp');
        card.innerHTML = `
          <div class="card-img" style="background-image: url('${item.img}')">
            ${getTypeBadgeHtml(item.locationType)}
          </div>
          <div class="card-body">
            <div class="card-date">📅 ${item.date || '随時受付'}</div>
            <div class="card-title">${item.title}</div>
            <div class="card-desc">${item.desc}</div>
            <div class="card-footer">
              <div class="card-price">${item.points.toLocaleString()} pt</div>
              <button class="btn btn-primary btn-sm" style="padding:6px 12px; font-size:0.8rem; border-radius:6px;">詳細を見る</button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function renderShowSchedules() {
      const container = document.getElementById('show-schedule-grid');
      container.innerHTML = '';

      showSchedules.forEach(item => {
        const card = document.createElement('div');
        card.className = 'show-card';
        const slotsHtml = item.slots.map(s => `<div class="show-slot">🕒 ${s}</div>`).join('');
        card.innerHTML = `
          <div class="show-card-badge">${item.status}</div>
          <div class="show-region">${item.region}</div>
          <div class="show-slot-list">${slotsHtml}</div>
          <button class="btn btn-secondary btn-sm" style="width:100%; font-size:0.8rem;" onclick="openTicketNotice('${item.region}')">チケットを申し込む</button>
        `;
        container.appendChild(card);
      });
    }

    function renderGoods() {
      const grid = document.getElementById('goods-grid');
      grid.innerHTML = '';

      goodsItems.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => openDetailModal(item, 'goods');
        card.innerHTML = `
          <div class="card-img" style="background-image: url('${item.img}')"></div>
          <div class="card-body">
            <div class="card-title">${item.title}</div>
            <div class="card-desc">${item.desc}</div>
            <div class="card-footer">
              <div class="card-price">${item.points.toLocaleString()} pt</div>
              <button class="btn btn-primary btn-sm" style="padding:6px 12px; font-size:0.8rem; border-radius:6px;">詳細を見る</button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openDetailModal(item, type) {
      const body = document.getElementById('modal-detail-body');
      
      let optionHtml = '';
      if (item.hasSize) {
        optionHtml = `
          <div class="form-group" style="margin-top:15px;">
            <label>サイズを選択してください</label>
            <select id="selected-size">
              <option value="S">S サイズ</option>
              <option value="M">M サイズ</option>
              <option value="L">L サイズ</option>
              <option value="XL">XL サイズ</option>
            </select>
          </div>
        `;
      }

      body.innerHTML = `
        <div class="modal-img" style="background-image: url('${item.img}')">
          ${getTypeBadgeHtml(item.locationType)}
        </div>
        <div class="modal-date">${item.date ? '開催日 / 受付: ' + item.date : ''}</div>
        <div class="modal-title">${item.title}</div>
        <div class="modal-desc">${item.desc}</div>
        ${optionHtml}
        <div class="modal-price-box">
          <span style="color:var(--text-muted);">必要ポイント</span>
          <span style="font-size:1.4rem; font-weight:800; color:var(--accent-gold);">${item.points.toLocaleString()} pt</span>
        </div>
        <button class="btn btn-primary" style="width:100%;" onclick="consumePoints('${item.title}', ${item.points}, ${item.hasSize})">申込みを実行する (${item.points.toLocaleString()} pt)</button>
      `;
      document.getElementById('detail-modal').style.display = 'flex';
    }

    function closeDetailModal() { document.getElementById('detail-modal').style.display = 'none'; }
    function openHistoryModal() { document.getElementById('history-modal').style.display = 'flex'; }
    function closeHistoryModal() { document.getElementById('history-modal').style.display = 'none'; }
    function openAdminModal() { document.getElementById('admin-modal').style.display = 'flex'; }
    function closeAdminModal() { document.getElementById('admin-modal').style.display = 'none'; }

    function openTicketNotice(region) {
      alert(`${region} 公演のチケット申込みは、画面最下部の「GIFTチケット」からお手続きいただくか、運営事務局へお問い合わせください。`);
    }

    function filterCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      renderExperiences();
    }

    function handleSearch() {
      searchQuery = document.getElementById('search-input').value.trim();
      renderExperiences();
    }

    function addPoints(amount) {
      userState.points += amount;
      userState.history.unshift({
        date: new Date().toLocaleDateString('ja-JP'),
        desc: "クレジットカード追加購入",
        amount: +amount
      });
      alert(`${amount.toLocaleString()} pt を追加購入しました！`);
      renderUI();
    }

    function consumePoints(title, cost, hasSize) {
      if (userState.points < cost) {
        alert("ポイントが不足しています。追加購入してください。");
        return;
      }

      let extraDesc = "";
      if (hasSize) {
        const size = document.getElementById('selected-size').value;
        extraDesc = ` (${size}サイズ)`;
      }

      if (confirm(`「${title}${extraDesc}」を ${cost.toLocaleString()} pt で申し込みますか？`)) {
        userState.points -= cost;
        userState.history.unshift({
          date: new Date().toLocaleDateString('ja-JP'),
          desc: `「${title}${extraDesc}」へ利用`,
          amount: -cost
        });
        alert("申込みが完了しました！");
        closeDetailModal();
        renderUI();
      }
    }

    function renderHistory() {
      const list = document.getElementById('history-list');
      list.innerHTML = '';
      userState.history.forEach(item => {
        const div = document.createElement('div');
        div.className = 'history-item';
        const isPlus = item.amount > 0;
        div.innerHTML = `
          <div>
            <div style="font-size:0.9rem;">${item.desc}</div>
            <div style="font-size:0.75rem; color:var(--text-muted);">${item.date}</div>
          </div>
          <div class="history-amount ${isPlus ? 'plus' : 'minus'}">
            ${isPlus ? '+' : ''}${item.amount.toLocaleString()} pt
          </div>
        `;
        list.appendChild(div);
      });
    }

    function addShowSchedule() {
      const region = document.getElementById('show-region').value;
      const status = document.getElementById('show-status').value;
      const slotsText = document.getElementById('show-slots').value;

      if (!region || !slotsText) {
        alert("エリア名と公演日時を入力してください。");
        return;
      }

      const slots = slotsText.split('\n').filter(s => s.trim() !== '');
      showSchedules.push({ id: Date.now(), region, status, slots });
      alert("新しいショースケジュールを追加しました！");
      closeAdminModal();
      renderUI();
    }

    function addNewItem() {
      const title = document.getElementById('new-title').value;
      const category = document.getElementById('new-category').value;
      const locationType = document.getElementById('new-location-type').value;
      const date = document.getElementById('new-date').value;
      const points = parseInt(document.getElementById('new-points').value);
      const hasSize = (document.getElementById('new-has-size').value === 'yes');
      const img = document.getElementById('new-img').value;
      const desc = document.getElementById('new-desc').value;

      if (!title || isNaN(points)) {
        alert("タイトルとポイント数は必須です。");
        return;
      }

      const itemObj = {
        id: Date.now(),
        category,
        locationType,
        date: date || "常時受付",
        title,
        desc: desc || "詳細情報は準備中です。",
        points,
        hasSize,
        img: img || "https://images.unsplash.com/photo-1591994843349-f415893b3a6b?w=500"
      };

      if (category === 'goods' || category === 'ticket') {
        goodsItems.unshift(itemObj);
      } else {
        experiences.unshift(itemObj);
      }

      alert("アイテムを追加しました！");
      closeAdminModal();
      renderUI();
    }

    renderUI();
  </script>
</body>
</html>
